<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1c22">
  <meta name="description" content="Play your music straight from Google Drive and Dropbox.">
  <title>Music Box</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" aria-label="Back" hidden></button>
    <h1 id="title">Music Box</h1>
    <a id="settings-link" class="icon-btn" href="#/settings" aria-label="Settings"></a>
  </header>
  <div id="offline" class="banner" hidden>You're offline. Only music saved on this device will play.</div>
  <div class="layout">
    <aside id="full" aria-label="Player"></aside>
    <main id="view"></main>
  </div>
  <footer id="mini" hidden></footer>
  <button id="fab-skin" class="fab" aria-label="Generate a new skin" title="New skin"></button>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Music Box needs JavaScript.</noscript>
</body>
</html>
